# mock/responses.yaml — scripted responses for the shipped `mock` model protocol.
# The mock client answers each task class from its list in order and wraps around; unlisted task classes
# return `{}`. `diff` values are unified diffs against strategy.py: the first against the stub rendered by
# `kanso init --demo`, the second and third against the state that first one leaves behind — which is what
# the lane holds again after each of them, since a discard and a crash both restore the run's best.
# So `kanso research run demo_mr --cards 3` in a freshly initialised demo is a keep, a discard and a crash,
# in that order. Past the third the script wraps, and a diff that does not fit the file in hand is invalid
# output like any other: the router retries, the cursor moves on, and the demo keeps going on whichever
# scripted answer does fit. That is the point at which the demo has shown what it can and you want a real
# model in models.yaml.
classify:
  - {construct: {id: sleeve}, objective_params: {min_delta: 0.0, k_se: 1.0}, constraints: [{id: strategy_integrity, params: {}}, {id: min_trades, params: {min: 30}}, {id: max_drawdown, params: {}}], rationale: "A complete signal-to-trade thesis with nothing deployed to attach to: a sleeve."}
certify_plan:
  - gates:
      - {id: embargoed_window, stage: cert, params: {min_fraction: 0.5}, rationale: "required; the only out-of-sample evidence"}
      - {id: publication_lag, stage: cert, params: {tolerance_s: 0}, rationale: "required; the synthetic series is realtime, so any lag at all is a surprise"}
      - {id: parity_replay, stage: cert, params: {ts_ns: 0}, rationale: "required; the live code path and the research one must submit the same orders"}
      - {id: cost_stress, stage: cert, params: {mult_a: 2, mult_b: 3}, rationale: "30m horizon: edge is cost-sensitive"}
      - {id: bootstrap, stage: cert, params: {n: 1000}, rationale: "drawdown band and objective CI for paper/live gates"}
      - {id: paper_forward, stage: paper, params: {min_duration: 5d, horizon_mult: 20}, rationale: "≥1 paper gate required"}
      - {id: live_drift, stage: live, params: {}, rationale: "≥1 live gate required"}
    excluded:
      - {id: deflated_sharpe, reason: "intraday objective is per-trade edge, not Sharpe"}
      - {id: capacity_vs_adv, reason: "the synthetic series carries no volume to size participation against"}
align_check:
  - {aligned: true, reason: "Same universe, resolution and mean-reversion mechanism."}
