      -        pass
      +    def on_bar(self, bar) -> None:
      +        window = self.kanso_config.lookback
      +        self.closes.append(float(bar.close))
      +        if len(self.closes) > window:
      +            self.closes.pop(0)
      +        if len(self.closes) < window:
      +            return
      +        mean = sum(self.closes) / window
      +        spread = sum((close - mean) ** 2 for close in self.closes) / window
