# instruments.yaml — rendered by `kanso init --demo`. One manual entry: the synthetic instrument the
# demo loader generates. `manual: true` suppresses resolution, so the demo needs no reference adapter
# and no credential; `override` carries the constructor fields, which is the whole definition.
# Tick and lot would come from kanso's dated convention table on their own; they are spelled out here
# so the shape of a manual entry is visible. The key is the qualified id, which is what a hypothesis's
# universe names and what the catalog files the instrument's datasets under.
DEMO.SIM:
  nautilus_id: DEMO.SIM
  asset_class: EQUITY
  manual: true
  corporate_actions: none
  override:
    currency: USD
    price_increment: "0.01"
    lot_size: "1"
  attributes: {}
  sources: {}
