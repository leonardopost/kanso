# instruments.yaml — rendered by `kanso init --demo`. One manual entry: the synthetic instrument the
# demo loader generates. `manual: true` suppresses resolution, so the demo needs no reference adapter
# and no credential; the fields below are the whole definition.
DEMO:
  nautilus_id: DEMO.SIM
  asset_class: EQUITY
  manual: true
  currency: USD
  price_precision: 2
  price_increment: "0.01"
  size_precision: 0
  size_increment: "1"
  lot_size: "1"
  multiplier: "1"
  corporate_actions: none
  attributes: {}
  sources: {}
