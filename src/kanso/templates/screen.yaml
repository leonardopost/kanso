# screen.yaml — a measurement before a lane (docs/concepts.md, Screen). Pinned by the sha256 of its bytes when it runs;
# results live in state.db and in the files kanso renders beside this one. Fill every blank a measure you choose needs: `clock.grid` only for the `grid` estimator.
schema: 1
id: "{{screen_id}}"
title: ""
thesis: ""                         # the relationship, falsifiable: who leads whom, by how long, how often
{{binding}}
legs:                              # name: {instrument: <catalog id>, type: bar|trade|quote|book, resolution: <bar size, bars only>}
#  btc:  {instrument: BTC-USDT-SWAP.OKX, type: trade}
#  mara: {instrument: MARA.XNAS, type: bar, resolution: 1s}
# derived:                         # synthetic legs, each a function of legs
#   miners: {basket: {mara: 0.5, riot: 0.5}}
#   pair:   {spread: {long: coin, short: mstr, hedge: ols, fit: first_fold}}   # or hedge: fixed, beta: 1.2
#   venues: {gap: {a: okx_btc, b: binance_btc}}
# groups:                          # names for sets of legs, used by measures
#   lead:   [btc]
#   follow: [mara, miners]
# signals:                         # name: a registered custom type's numeric field, as one series filed under instrument
#   regime:    {type: house_state, field: level, instrument: SPY.ARCX}
#   event_day: {type: house_calendar, field: flag, instrument: SPY.ARCX}
clock:
  grid:                            # <n>(ms|s|m|h): the step a `grid` estimator samples on; no finer than a bar leg
  hours: overlap                   # overlap | {tz: America/New_York, span: "09:30-16:00"}; 1m bars stamped at their close: span "09:31-16:01"
measures:                          # lead_lag | response | catch_up | condition, each parameter within its range (docs/workspace.md, screens/<id>/); every list is a declared, finite lattice
#  - id: lead_lag
#    from: lead
#    to: follow
#    estimator: grid               # grid | hy (asynchronous prints, no grid)
#    lags: [-5s, 1s, 2s, 5s]       # never zero: the same instant's co-movement is not a lead
#  - id: response
#    trigger: {leg: btc, move_bp: [10, 20], within: 2s}   # or {leg: pair, z: [2, 3], lookback: 30m}
#    followers: follow
#    side: with                    # with | against
#    horizons: [5s, 30s]
#    latency_ms: 5                 # the order round trip of the route you would trade through; the one a response uses
#  - id: catch_up                  # trade the follower toward its leader's move until it has caught up; exits are conditions
#    leader: btc
#    followers: follow
#    within: 5s                    # the trailing span the leader's move and the follower's are measured over
#    fit: first_fold               # first_fold or window, where beta, the follower's response (either sign), is fitted
#    beta_over: 1m                 # the return span beta is fitted at
#    enter_bp: [5, 10]             # the implied move and the gap that open a position, each at least this, the same way
#    close: [0, 0.5]               # caught up: the share of the entry gap left, under 1
#    stop: [2]                     # failed: the multiple of the entry gap, over 1
#    max_hold: 10m                 # a safety, counted when it fires; never the rule
#    latency_ms: 5
#  - id: condition                 # a follower's session returns while a declared signal meets a declared comparison; one measure is one family
#    tests:                        # name: one pre-registered test; the cells are tests x followers
#      up:
#        signal: regime
#        when: {gt: 0}             # exactly one of gt, ge, lt, le, eq, ne: the favoured state
#        against: {lt: 0}          # contrast only: a comparison disjoint from when, or rest
#        entry: close              # open | close: the session's first or last point
#        exit: close               # open | close; close to close runs from the previous session's close
#        hold: while               # while | {sessions: k}
#        side: long                # long | short: the position the favoured state takes
#    followers: follow             # a leg or a group of catalog legs, never a derived leg
#    payoff: contrast              # contrast | long_flat
#    null_by: circular             # circular | sign_flip; never `null:`, which YAML reads as no key at all
#    min_shift: 30                 # circular only: the fewest sessions a shift moves the positions
#    # block: 20                   # sign_flip only: sessions summed into one sign, at least every fixed hold
#    demean: [weekday, month, {turn_of_month: [1, 3]}, third_friday_week, pre_holiday]   # [] for the window's mean alone
#    controls: [event_day]         # 0/1 signals, each a point dated every session; [] for none
#    latency_ms: 900000            # how long before the entry it orders the decision is made, at least 1
#    # mde_power: 0.8              # optional: beside a verdict, the effect a cell would need to pass at this power
# verdict:                         # optional and never defaulted: declare it before you run, never after reading a result
#   alpha: 0.05                    # family-wise, over every cell of a measure; a condition's null has its own floor: 2^(1 - blocks) or 1/(sessions - 2 min_shift + 2)
#   min_margin_bp: 1.0             # gross per event less the hurdle
#   min_events_per_day: 20
#   min_sessions: 20
