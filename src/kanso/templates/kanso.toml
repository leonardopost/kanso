# kanso workspace config. Generated by `kanso init`; edit freely. Keys and defaults: docs/workspace.md.
kanso_version = "{{kanso_version}}"
schema_version = 1
# kanso never runs git: committing this workspace is yours to do; the rendered .gitignore lists what to leave out.

[extensions]
paths = ["kanso_ext"]              # workspace packages providing loaders, constructs, custom data types, data adapters, execution clients (docs/extensions.md)

[skills]
# Where `kanso skills sync` links the packaged skills. Add your tool's path if missing.
targets = [".claude/skills", ".cursor/skills", ".codex/skills"]

[research]
capital = 100000          # default backtest starting balance for cards/cert/compose; hypothesis.yaml `capital` overrides
broker = "alpaca"         # whose venue model (account type, currency, costs) research inherits; portfolio.yaml venues.<MIC> overrides per venue
account = "margin"        # margin | cash. margin with default_leverage = risk_limits.max_leverage, so max_leverage 1 still forbids borrowing but allows shorts
currency = "USD"          # account currency; a universe whose instruments span more than one is refused at `kanso hyp validate`
return_period = "1d"      # the period a return is measured over, for every objective and drawdown
annualisation = "auto"    # observed periods per year in the window; set a number to force one
align_every = 10          # alignment check cadence (cards)
stall_k = 30              # consecutive non-keeps before the run ends (certify if a keep exists, else requeue)
context_cards = 20        # last cards shown to the proposer
folds = 4                 # contiguous folds for metric / metric_se
max_lines_per_keep = 40   # complexity rule: a keep growing strategy.py by more lines must clear max(min_delta, 2 × k_se × metric_se)
baseline_budget_s = 1800  # wall-clock cap for the baseline card; card_budget_s = max(60, 3 × baseline_wall_s)

[certify]
n_fail = 3                # consecutive certification failures before `failed`

[env]
# Overrides for the lane plan; leave unset to use the defaults (docs/concepts.md, envelope).
# reserved_cores = 2
# reserved_mem_gb = 8
# cores_per_lane = 2

[monitor]
interval = "5m"

[webhook]
# url = "https://<any endpoint accepting a JSON POST>"   # per escalation; env KANSO_WEBHOOK_URL is the fallback
