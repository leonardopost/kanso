# hypothesis.yaml — the unit of research (docs/concepts.md). Pinned by the sha256 of its bytes (`hypothesis_sha`) by `kanso hyp add` / `kanso classify`; committing it is yours to do.
# Status, data snapshot and run pins live in state.db, never here. Blank fields must be set before `kanso hyp validate` passes.
schema: 1
id: "{{hyp_id}}"
title: ""
thesis: ""                         # ≤2 sentences, falsifiable
mechanism:                         # mean_reversion|momentum|microstructure|stat_arb|event|carry|vol|other
universe: []                       # ids from instruments.yaml; venues derive from their nautilus_id
horizon:                           # holding period: <n>(s|m|h|d|w)
resolution:                        # bar duration <n>(s|m|h|d|w), or tick|quote|trade
data_requirements: [bar]           # bar|quote|trade|<any registered custom type id>
# costs:                           # optional. Costs are inherited from the venue, which the configured broker defines
#   commission_bps: 0.5            # (kanso.toml research.broker, portfolio.yaml venues.<MIC>). Set any subset here only to
#   commission_per_share: 0.0055   # charged on every share of a fill that pays commission, on top of the rates; a maker's fill
#                                  # under a stated maker_bps pays that rate alone
#   slippage_bps: 1.0              # override them for this hypothesis — the way to test an idea against costs worse than
#   spread: fixed_bps              # your broker's. quotes | fixed_bps. `quotes` needs `quote` in data_requirements; without it
#   fixed_bps: 2                   # `spread: fixed_bps` and a `fixed_bps` width are required here or under venues.<MIC>.costs,
                                   # or `kanso hyp validate` refuses (exit 3): there are no quotes to take a spread from
#   maker_bps: -0.2                # what a fill that rested on the book pays instead of the three above; negative is a
                                   # rebate. Unset, it pays what any fill pays
#   limit_fill: touch              # touch | through: a resting limit fills when the market reaches its price (the engine's
                                   # rule), or only once a bar's low/high or a print goes beyond it. kanso's simulated venues only
# capital: 100000                  # backtest starting balance; default kanso.toml research.capital
# sizing:                          # yours: classification never touches it. Scope: changing it clears `best`
#   mode: full_book                # every entry is the whole budget in one instrument, floor(budget / price) whole lots with the
#   budget: 100000                 # round trip reserved; one instrument held at a time; every exit the whole position; submit_entry
#                                  # and submit_exit take no size. `kanso hyp validate` refuses (exit 3) unless
#                                  # capital x max_position_pct / 100 >= budget and capital x max_leverage >= budget
risk_limits:                       # *_pct are percentages of capital; an unsized entry's room is read on
                                   # the smaller of capital and what the account is worth, so no borrowing
  max_position_pct: 20
  max_drawdown_pct: 15
  max_leverage: 1
windows:                           # dates YYYY-MM-DD; certification.start ≥ research.end + max(5×horizon, 1d)
  research:      {start: , end: }
  certification: {start: , end: }
  forward:       {start: }         # no end; paper/live replay starts here
# warmup:                          # yours: classification never touches it. Scope: changing it clears `best`
#   sessions: 20                   # the last N sessions (days any universe name printed at the sleeve's grain; the
#                                  # host's, for an attached construct) before each window are fed to the strategy
#                                  # first, every order dropped until the window opens,
#                                  # so it trades from the open with its indicators full. `research begin` refuses
#                                  # (exit 2) when the catalog holds fewer; the snapshot must cover them
# benchmark:                       # yours: classification never touches it. Scope: changing it, or the universe's order, clears `best`
#   hold: first_leg                # the objective becomes wf_sharpe_vs_hold: the Sharpe over buying universe[0] on the
#                                  # first print and never exiting, run by the same runner; a day or longer, sleeve or alpha only
# book:                            # yours: classification never touches it. Scope: changing any key clears `best`
#   reset: monthly                 # monthly | none. At the first period end of each calendar month the book returns to
#                                  # `capital`: a surplus moves to a cushion outside the book, a deficit is restored from
#                                  # it while it lasts, never borrowed. Returns are struck before the transfer
#   financing_rate_bps: 250        # per year, on gross exposure (shorts included) above the book's equity, charged once per
#                                  # return period by the runner; `cost_stress` leaves it alone. 0 charges nothing
#   maintenance_pct: 25            # floor for the `maintenance_margin` gate: the period-end holdings at the period's
#                                  # worst prices, as a percentage of their gross; `hyp validate` refuses (exit 3) a
#                                  # floor above 100 / max_leverage. A reset or a carry needs a margin account (exit 3)
construct:                         # (set by kanso classify) {id: sleeve|alpha|filter|overlay|exit|execution|allocation|<extension>, host?, params?, rationale}
objective:                         # (set by kanso classify) {id, params: {min_delta, k_se}}
constraints:                       # (set by kanso classify) card-stage gates [{id, params}]; cert/paper/live gates are planned at certification
