id: edge_per_trade
kind: gate
stage: card
required: false
meaningful_when: "When the thesis is that each trade pays, not that the book trades less: mean net edge per closed trade, bp of notional, less k_se of its error read by period, must exceed min_bps."
params: {min_bps: float, k_se: float}
ranges: {min_bps: [0.0, 50.0], k_se: [0.0, 3.0]}
impl: kanso.criteria.gates.edge_per_trade
